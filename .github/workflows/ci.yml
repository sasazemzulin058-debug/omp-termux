name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - .github/VOUCHED.td
  pull_request:
    branches: [main]
  workflow_dispatch:

# Keep PR feedback current; never cancel main pushes or manual runs.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  check:
    name: Type check and web build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun-install
      - name: Type check workspace
        run: bun run ci:check:full
      - name: Build collab web
        run: bun run collab:web:build

  android-overlay:
    name: Android overlay validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply Android patch queue
        shell: bash
        run: bash android/scripts/apply-patches.sh
      - name: Validate Android overlay
        run: python3 android/scripts/verify-overlay.py
      - name: Validate release inputs
        run: python3 android/scripts/check-release-inputs.py
