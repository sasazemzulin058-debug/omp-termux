name: Android release

on:
  push:
    tags:
      - "v*-termux"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach to"
        required: true

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  BUN_VERSION: "1.3.14"

jobs:
  native-addon:
    name: Build Android ARM64 native addon
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          df -h /

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3

      - name: Verify Android overlay and release tag
        run: python3 android/scripts/verify-overlay.py

      - name: Validate release inputs
        run: python3 android/scripts/check-release-inputs.py

      - name: Install Rust target
        run: |
          set -euo pipefail
          source android/versions.env
          rustup toolchain install "$RUST_TOOLCHAIN"
          rustup default "$RUST_TOOLCHAIN"
          rustup target add aarch64-linux-android

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Make CMake find Ninja
        run: |
          set -euo pipefail
          ninja=$(command -v ninja || command -v ninja-build)
          cmake_bin=$(command -v cmake)
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/cmake" <<EOF
          #!/bin/sh
          if [ "\$1" = "--build" ]; then
            exec "$cmake_bin" "\$@"
          fi
          args=""
          for arg in "\$@"; do
            case "\$arg" in
              -DCMAKE_SYSTEM_PROCESSOR=*) continue ;;
            esac
            args="\$args \"\$arg\""
          done
          eval exec "$cmake_bin" \$args -DCMAKE_MAKE_PROGRAM="$ninja" -DCMAKE_POLICY_DEFAULT_CMP0057=NEW
          EOF
          chmod +x "$RUNNER_TEMP/bin/cmake"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install JS dependencies
        run: bun install --minimum-release-age 0
      - name: Cross-compile native addon
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          CARGO_BUILD_JOBS: 4
          RAYON_NUM_THREADS: 4
          MAKEFLAGS: "-j4"
          NUM_JOBS: 4
          CMAKE_BUILD_PARALLEL_LEVEL: 4
          NINJAFLAGS: "-j4"
          OPUS_NO_PKG_CONFIG: "1"
          CMAKE_GENERATOR: Ninja
          CARGO_INCREMENTAL: "false"
          CARGO_TERM_COLOR: always
        run: bash android/scripts/build-android-ci.sh

      - name: Verify native addon artifact naming and checksum
        run: |
          set -euo pipefail
          test -s packages/natives/native/pi_natives.android-arm64.node
          test -s packages/natives/native/pi_natives.android-arm64.node.sha256
          (cd packages/natives/native && sha256sum -c pi_natives.android-arm64.node.sha256)

      - name: Upload native addon
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-native
          path: |
            packages/natives/native/pi_natives.android-arm64.node
            packages/natives/native/pi_natives.android-arm64.node.sha256
          if-no-files-found: error

  js-bundle:
    name: Build Termux JavaScript bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Verify Android overlay and release tag
        run: python3 android/scripts/verify-overlay.py

      - name: Validate release inputs
        run: python3 android/scripts/check-release-inputs.py

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install JS dependencies
        run: bun install --minimum-release-age 0

      - name: Build JavaScript bundle
        run: |
          set -euo pipefail
          # Lean path: no host linux-x64 natives, no stats vite pipeline.
          # Full arm64 package still embeds docs + natives loader stubs.
          bun android/scripts/build-termux-js.ts
          test -s termux-js.tar.gz

      - name: Verify JavaScript bundle archive contents
        run: |
          set -euo pipefail
          test -s termux-js.tar.gz
          tar -tzf termux-js.tar.gz | grep -Fx './cli.js'
          tar -tzf termux-js.tar.gz | grep -F 'node_modules/@oh-my-pi/pi-natives/package.json'
          tar -tzf termux-js.tar.gz | grep -F 'node_modules/@oh-my-pi/pi-natives/native/index.js'

      - name: Upload JavaScript bundle
        uses: actions/upload-artifact@v4
        with:
          name: termux-js-bundle
          path: termux-js.tar.gz
          if-no-files-found: error

  package-release:
    name: Package and publish GitHub Release
    needs: [native-addon, js-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Verify Android overlay and release tag
        run: python3 android/scripts/verify-overlay.py
      - name: Validate release inputs
        run: python3 android/scripts/check-release-inputs.py

      - name: Download native addon
        uses: actions/download-artifact@v4
        with:
          name: android-arm64-native
          path: packages/natives/native

      - name: Download JavaScript bundle
        uses: actions/download-artifact@v4
        with:
          name: termux-js-bundle
          path: .

      - name: Assemble and test release bundle
        run: |
          set -euo pipefail
          source android/versions.env
          test -s packages/natives/native/pi_natives.android-arm64.node
          test -s packages/natives/native/pi_natives.android-arm64.node.sha256
          (cd packages/natives/native && sha256sum -c pi_natives.android-arm64.node.sha256)
          test -s termux-js.tar.gz
          tar -tzf termux-js.tar.gz | grep -Fx './cli.js'
          rm -rf termux-bundle
          mkdir termux-bundle
          tar -xzf termux-js.tar.gz -C termux-bundle
          mkdir -p termux-bundle/node_modules/@oh-my-pi/pi-natives/native
          cp packages/natives/native/pi_natives.android-arm64.node \
            termux-bundle/node_modules/@oh-my-pi/pi-natives/native/
          test -s termux-bundle/cli.js
          test -s termux-bundle/node_modules/@oh-my-pi/pi-natives/native/pi_natives.android-arm64.node

          # Download Bun binary (prefer custom built release asset if available, fallback to npm 1.3.14)
          if curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/bun" -o termux-bundle/bun 2>/dev/null; then
            echo "Using custom built Bun from release asset"
          else
            echo "Fetching official Bionic Bun from npm"
            bun_pkg_url="https://registry.npmjs.org/@oven/bun-linux-aarch64-android/-/bun-linux-aarch64-android-${BUN_VERSION}.tgz"
            curl -fsSL "$bun_pkg_url" | tar -xz -C termux-bundle --strip-components=1 package/bin/bun
          fi
          chmod +x termux-bundle/bun
          test -x termux-bundle/bun

          tar -czf omp-termux.tar.gz -C termux-bundle .
          sha256sum omp-termux.tar.gz > omp-termux.tar.gz.sha256
          test -s omp-termux.tar.gz
          test -s omp-termux.tar.gz.sha256
          sha256sum -c omp-termux.tar.gz.sha256
          tar -tzf omp-termux.tar.gz | grep -Fx './cli.js'
          tar -tzf omp-termux.tar.gz | grep -Fx './bun'
          tar -tzf omp-termux.tar.gz | grep -F './node_modules/@oh-my-pi/pi-natives/native/pi_natives.android-arm64.node'
          (cd packages/natives/native && sha256sum -c pi_natives.android-arm64.node.sha256)
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            omp-termux.tar.gz
            omp-termux.tar.gz.sha256
            packages/natives/native/pi_natives.android-arm64.node
            packages/natives/native/pi_natives.android-arm64.node.sha256
          fail_on_unmatched_files: true