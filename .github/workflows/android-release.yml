name: Android release

# On a pushed `v*` tag: cross-compile the android-arm64 addon via the Android
# NDK and attach it to the GitHub Release so Termux users can download a
# prebuilt .node instead of building on-device.

on:
  push:
    tags:
      - "v*-termux"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach to"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and attach android-arm64 addon
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Rust target for the repo-pinned toolchain
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android

      - name: Install Android NDK r27
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: false


      - name: Install JS dependencies
        run: bun install --minimum-release-age 0

      # bun's hoisting does not always surface @napi-rs/cli as a top-level
      # .bin. Add the explicit dep in a scratch workspace to guarantee the bin
      # exists when the build script needs it.
      - name: Ensure napi CLI is available
        run: |
          if [ ! -x node_modules/.bin/napi ]; then
            bun add --no-save @napi-rs/cli@3.7.0
          fi
          test -x node_modules/.bin/napi || { echo "napi still missing"; exit 1; }

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y make

      - name: Cross-compile native addon (NDK clang)
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          CARGO_BUILD_JOBS: 2
          OPUS_NO_PKG_CONFIG: "1"
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          CMAKE_CXX_COMPILER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
        run: bash android/scripts/build-android-ci.sh

      - name: Build Termux bundle
        shell: bash
        run: |
          set -euo pipefail
          bun --cwd=packages/stats scripts/generate-client-bundle.ts --generate
          bun --cwd=packages/coding-agent scripts/generate-docs-index.ts --generate
          bun --cwd=packages/coding-agent scripts/embed-mupdf-wasm.ts --generate
          bun build --target=bun --minify --keep-names \
            --external @oh-my-pi/pi-natives \
            --define 'process.env.PI_BUNDLED="true"' \
            packages/coding-agent/src/cli.ts --outdir termux-build
          mkdir -p termux-bundle/node_modules/@oh-my-pi/pi-natives/native
          cp termux-build/cli.js termux-bundle/cli.js
          cp packages/natives/package.json termux-bundle/node_modules/@oh-my-pi/pi-natives/
          cp packages/natives/native/index.js packages/natives/native/loader-state.js \
            packages/natives/native/embedded-addon.js \
            termux-bundle/node_modules/@oh-my-pi/pi-natives/native/
          cp packages/natives/native/pi_natives.android-arm64.node \
            termux-bundle/node_modules/@oh-my-pi/pi-natives/native/
          # All JS dependencies are bundled. Only Android native addon stays external.
          tar -czf omp-termux.tar.gz -C termux-bundle .
          sha256sum omp-termux.tar.gz > omp-termux.tar.gz.sha256

      - name: Test Termux bundle shape
        run: |
          test -s omp-termux.tar.gz
          tar -tzf omp-termux.tar.gz | grep -Fx './cli.js'
          tar -tzf omp-termux.tar.gz | grep -F 'pi_natives.android-arm64.node'

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            omp-termux.tar.gz
            omp-termux.tar.gz.sha256
            packages/natives/native/pi_natives.android-arm64.node
            packages/natives/native/pi_natives.android-arm64.node.sha256
          fail_on_unmatched_files: true
