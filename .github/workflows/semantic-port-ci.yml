name: semantic-port CI

on:
  push:
    branches: [semantic-port-20260831]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NDK_VERSION: r27

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type check & web build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun-install
      - name: Type check workspace
        run: bun run ci:check:full
      - name: Build collab web
        run: bun run collab:web:build

  focused-tests:
    name: Semantic focused tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun-install
      - name: Run semantic focused tests
        shell: bash
        run: |
          set -euo pipefail
          bun test \
            packages/coding-agent/test/android-helpers.test.ts \
            packages/coding-agent/test/custom-controller-termux.test.ts \
            packages/coding-agent/test/custom-service-termux.test.ts \
            packages/coding-agent/test/custom-service-extended.test.ts \
            packages/coding-agent/test/generator-android.test.ts \
            packages/coding-agent/test/learn-commands-termux.test.ts \
            packages/coding-agent/test/repo-root-isolation.test.ts \
            packages/coding-agent/test/reviewer-fixes-termux.test.ts \
            packages/coding-agent/test/settings-policy.test.ts

  android-native:
    name: Android native compilation (NDK)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-system-deps
      - uses: ./.github/actions/bun-install
      - name: Install Rust toolchain and Android target
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel *= *"\([^"\]*\)".*/\1/p' rust-toolchain.toml | sed -n '1p')"
          if [ -z "$toolchain" ]; then
            echo "::error::could not read channel from rust-toolchain.toml"
            exit 1
          fi
          echo "Installing Rust toolchain $toolchain"
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          rustup default "$toolchain"
          rustup target add aarch64-linux-android --toolchain "$toolchain"
          rustc --version
          cargo --version
          rustup target list --installed > "$RUNNER_TEMP/rust-targets.txt" 2>&1 || true
          cat "$RUNNER_TEMP/rust-targets.txt" 2>&1 | sed -n '1,20p' || true
          grep -q "aarch64-linux-android" "$RUNNER_TEMP/rust-targets.txt" || { echo "::error::aarch64-linux-android target not installed"; exit 1; }
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
      - name: Verify NDK
        shell: bash
        run: |
          set -euo pipefail
          echo "NDK_VERSION=${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT:-}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-}"
          echo "NDK path from action: ${{ steps.setup-ndk.outputs.ndk-path }}"
          if [ -z "${ANDROID_NDK_ROOT:-}" ] && [ -z "${ANDROID_NDK_HOME:-}" ] && [ -z "${{ steps.setup-ndk.outputs.ndk-path }}" ]; then
            echo "::error::NDK not configured (ANDROID_NDK_ROOT, ANDROID_NDK_HOME, and action output all empty)"
            exit 1
          fi
          ndk_root="${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-${{ steps.setup-ndk.outputs.ndk-path }}}}"
          echo "Resolved NDK root: $ndk_root"
          # If wrapper NDK lacks real clang, prefer SDK NDK that contains it
          if [ ! -x "$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
            for cand in "${ANDROID_NDK_ROOT:-}" "${ANDROID_NDK_HOME:-}" "${{ steps.setup-ndk.outputs.ndk-path }}"; do
              if [ -n "$cand" ] && [ -x "$cand/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
                ndk_root="$cand"
                echo "Corrected NDK root to real clang location: $ndk_root"
                break
              fi
            done
          fi
          ls -1 "$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin" 2>&1 | sed -n '1,20p' || true
          test -x "$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" || { echo "::error::NDK clang not found at $ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"; ls -1 "$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin" 2>&1 | sed -n '1,50p' || true; exit 1; }
          test -x "$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" || { echo "::error::NDK clang++ not found at $ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"; exit 1; }
          # At least one aarch64 wrapper or ability to use --target should exist; show available aarch64 files pipefail-safe
          find "$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin" -maxdepth 1 -type f -name 'aarch64-linux-android*clang*' -print 2>&1 | sed -n '1,20p' || true
          if [ -d "/usr/local/lib/android/sdk/ndk" ]; then
            ls -1 "/usr/local/lib/android/sdk/ndk" 2>&1 | sed -n '1,20p' || true
          fi
          test -x "$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang" || test -x "$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang" || test -x "$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" || { echo "::error::NDK clang toolchain not found in $ndk_root"; exit 1; }
      - name: Android native build (Bazel if available, else cargo check)
        shell: bash
        run: |
          set -euo pipefail
          ndk_root="${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$ndk_root" ]; then
            ndk_root="${{ steps.setup-ndk.outputs.ndk-path }}"
          fi
          if [ -z "$ndk_root" ]; then
            echo "::error::NDK root not set; cannot configure Android toolchain"
            exit 1
          fi
          # Prefer real NDK with actual clang if wrapper path is broken
          if [ ! -x "$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
            for cand in "${ANDROID_NDK_ROOT:-}" "${ANDROID_NDK_HOME:-}" "${{ steps.setup-ndk.outputs.ndk-path }}"; do
              if [ -n "$cand" ] && [ -x "$cand/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
                ndk_root="$cand"
                echo "Corrected NDK root to real clang location: $ndk_root"
                break
              fi
            done
          fi
          if [ ! -x "$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
            echo "::error::real NDK clang not found at $ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
            ls -1 "$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin" 2>&1 | sed -n '1,50p' || true
            find "$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin" -maxdepth 1 -type f -name 'aarch64*' -print 2>&1 | sed -n '1,20p' || true
            exit 1
          fi
          if [ ! -x "$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" ]; then
            echo "::error::real NDK clang++ not found at $ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
            exit 1
          fi
          export ANDROID_NDK_ROOT="$ndk_root"
          export ANDROID_NDK_HOME="$ndk_root"
          export NDK_HOME="$ndk_root"
          real_clang="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          real_clangpp="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          echo "Real NDK clang: $real_clang"
          ls -1 "$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin" 2>&1 | sed -n '1,20p' || true
          # Create temporary wrapper that invokes real clang with explicit Android target
          wrapper_dir="$RUNNER_TEMP/ndk-clang-wrapper"
          mkdir -p "$wrapper_dir"
          chosen_api=""
          for api in 35 34 33 30 29 28 27 26 24 23 21; do
            # Prefer API level where sysroot exists or wrapper already present; otherwise still create for highest
            if [ -x "$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${api}-clang" ] || [ "$api" = "35" ]; then
              chosen_api="$api"
              break
            fi
          done
          if [ -z "$chosen_api" ]; then
            chosen_api="35"
          fi
          cat > "$wrapper_dir/aarch64-linux-android${chosen_api}-clang" <<WRAPPER_EOF
          #!/bin/sh
          exec "$real_clang" --target=aarch64-linux-android${chosen_api} "\$@"
          WRAPPER_EOF
          chmod +x "$wrapper_dir/aarch64-linux-android${chosen_api}-clang"
          cat > "$wrapper_dir/aarch64-linux-android${chosen_api}-clang++" <<WRAPPER_EOF
          #!/bin/sh
          exec "$real_clangpp" --target=aarch64-linux-android${chosen_api} "\$@"
          WRAPPER_EOF
          chmod +x "$wrapper_dir/aarch64-linux-android${chosen_api}-clang++"
          export CC_aarch64_linux_android="$wrapper_dir/aarch64-linux-android${chosen_api}-clang"
          export CXX_aarch64_linux_android="$wrapper_dir/aarch64-linux-android${chosen_api}-clang++"
          export CC="$CC_aarch64_linux_android"
          export CXX="$CXX_aarch64_linux_android"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          real_ar="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          real_ranlib="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib"
          test -x "$real_ar" || { echo "::error::NDK llvm-ar not found at $real_ar"; exit 1; }
          test -x "$real_ranlib" || { echo "::error::NDK llvm-ranlib not found at $real_ranlib"; exit 1; }
          export AR_aarch64_linux_android="$real_ar"
          export RANLIB_aarch64_linux_android="$real_ranlib"
          export AR="$real_ar"
          export RANLIB="$real_ranlib"
          cat > "$wrapper_dir/aarch64-linux-android${chosen_api}-ar" <<AR_WRAPPER_EOF
          #!/bin/sh
          exec "$real_ar" "\$@"
          AR_WRAPPER_EOF
          chmod +x "$wrapper_dir/aarch64-linux-android${chosen_api}-ar"
          cat > "$wrapper_dir/aarch64-linux-android${chosen_api}-ranlib" <<RANLIB_WRAPPER_EOF
          #!/bin/sh
          exec "$real_ranlib" "\$@"
          RANLIB_WRAPPER_EOF
          chmod +x "$wrapper_dir/aarch64-linux-android${chosen_api}-ranlib"
          export PATH="$wrapper_dir:$PATH"
          export AR_aarch64_linux_android="$wrapper_dir/aarch64-linux-android${chosen_api}-ar"
          export RANLIB_aarch64_linux_android="$wrapper_dir/aarch64-linux-android${chosen_api}-ranlib"
          echo "Using NDK clang wrapper for API $chosen_api: $CC_aarch64_linux_android -> $real_clang --target=aarch64-linux-android${chosen_api}"
          # Verify wrapper and real clang are executable pipefail-safe
          "$CC_aarch64_linux_android" --version 2>&1 | sed -n '1,5p' || true
          test -x "$CC_aarch64_linux_android" || { echo "::error::wrapper clang not executable at $CC_aarch64_linux_android"; exit 1; }
          test -x "$real_clang" || { echo "::error::real clang not executable at $real_clang"; exit 1; }
          # Detect whether repository provides an upstream-compatible Android Bazel target
          # (no such target exists in current upstream; this is the honest fallback path)
          if grep -R -q "aarch64-linux-android" MODULE.bazel bazel/ BUILD.bazel 2>/dev/null; then
            echo "Detected Bazel Android target in MODULE.bazel/bazel/ — attempting Bazel build"
            if command -v bazelisk >/dev/null 2>&1; then
              bazelisk build --config=ci //crates/... --platforms=//bazel/platforms:linux-arm64 >"$RUNNER_TEMP/bazel-probe.log" 2>&1 || true
              sed -n '1,100p' "$RUNNER_TEMP/bazel-probe.log" || true
              echo "Bazel probe completed; proceeding to cargo check for NDK verification"
            else
              echo "::warning::bazelisk not found, skipping Bazel probe and using cargo check"
            fi
          else
            echo "No Bazel Android target found (expected for current upstream) — using cargo check with NDK"
          fi
          echo "Running cargo check for Android target..."
          toolchain="$(sed -n 's/^channel *= *"\([^"\]*\)".*/\1/p' rust-toolchain.toml | sed -n '1p')"
          cargo +"$toolchain" check --target aarch64-linux-android -p pi-natives --locked
          echo "cargo check -p pi-natives for aarch64-linux-android succeeded"
