name: Build Bun for Android ARM64

on:
  workflow_dispatch:
    inputs:
      bun_ref:
        description: "Git ref/branch/tag of oven-sh/bun to build"
        required: true
        default: "main"
      use_commit:
        description: "Specific commit SHA to checkout (overrides ref if set)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-bun:
    name: Cross-compile Bun for Android aarch64 (Bionic)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Checkout omp-termux
        uses: actions/checkout@v4

      - name: Load version manifest
        id: manifest
        run: |
          source android/versions.env
          echo "ndk_version=$NDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "rust_toolchain=$RUST_TOOLCHAIN" >> "$GITHUB_OUTPUT"
          echo "bun_version=$BUN_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install system build dependencies and LLVM 21
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake libssl-dev libcurl4-openssl-dev ruby-full ccache software-properties-common wget

          # Install official Clang 21 from apt.llvm.org to satisfy Bun build scripts
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add - || true
          sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" || true
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends clang-21 lld-21 llvm-21 || true

          if command -v clang-21 >/dev/null 2>&1; then
            sudo ln -sf "$(command -v clang-21)" /usr/local/bin/clang
            sudo ln -sf "$(command -v clang++-21)" /usr/local/bin/clang++
            sudo ln -sf "$(command -v ld.lld-21)" /usr/local/bin/ld.lld
            sudo ln -sf "$(command -v llvm-ar-21)" /usr/local/bin/llvm-ar
          fi
          clang --version || true

      - name: Install Rust toolchain
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain "${{ steps.manifest.outputs.rust_toolchain }}"
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup_ndk
        with:
          ndk-version: ${{ steps.manifest.outputs.ndk_version }}
          add-to-path: true

      - name: Configure NDK clang as default
        env:
          NDK_ROOT: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          NDK_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          sudo ln -sf "$NDK_BIN/clang" /usr/local/bin/clang
          sudo ln -sf "$NDK_BIN/clang++" /usr/local/bin/clang++
          sudo ln -sf "$NDK_BIN/llvm-ar" /usr/local/bin/llvm-ar
          sudo ln -sf "$NDK_BIN/llvm-ranlib" /usr/local/bin/llvm-ranlib
          sudo ln -sf "$NDK_BIN/ld.lld" /usr/local/bin/ld.lld
          sudo ln -sf "$NDK_BIN/llvm-strip" /usr/local/bin/llvm-strip
          clang --version

      - name: Clone Bun source
        env:
          BUN_REF: ${{ github.event.inputs.bun_ref || 'main' }}
          COMMIT_SHA: ${{ github.event.inputs.use_commit }}
        run: |
          echo "=== Cloning oven-sh/bun ($BUN_REF) ==="
          git clone --depth 50 "https://github.com/oven-sh/bun.git" /tmp/bun-src
          cd /tmp/bun-src
          if [ -n "$COMMIT_SHA" ]; then
            git checkout "$COMMIT_SHA"
          else
            git checkout "$BUN_REF"
          fi
          git submodule update --init --recursive --depth 1
          echo "Checked out commit: $(git rev-parse HEAD)"
          echo "bun_commit=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Patch Clang version requirement for NDK r27c fallback
        run: |
          cd /tmp/bun-src
          # In case clang-21 is not found, patch all build scripts to accept clang 18
          grep -rn "21\.1\.0" scripts/ || true
          find scripts/ -type f \( -name "*.ts" -o -name "*.js" -o -name "*.zig" \) -exec sed -i \
            -e 's/>=21\.1\.0/>=18.0.0/g' \
            -e 's/version >=21\.1\.0/version >=18.0.0/g' \
            -e 's/<21\.1\.99/<22.0.0/g' \
            -e 's/21\.1\.[0-9]*/18.0.3/g' {} + || true
          echo "=== Verification of scripts after patch ==="
          grep -rn "18\.0\.0" scripts/ || echo "No occurrences replaced"

      - name: Install Bun bootstrapper

      - name: Cross-compile Bun for aarch64-linux-android
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup_ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
          CCACHE_DIR: /tmp/ccache
          LDFLAGS: "-L${{ steps.setup_ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/28"
        run: |
          mkdir -p /tmp/ccache
          cd /tmp/bun-src
          echo "=== Building Bun for aarch64-linux-android (release) ==="
          echo "NDK: $ANDROID_NDK_ROOT"
          echo "Bootstrapper: $(bun --version)"
          echo "Start: $(date)"

          bun scripts/build.ts \
            --profile=release \
            --abi=android \
            --arch=aarch64 \
            --build-dir="build/release"

          echo "End: $(date)"

      - name: Verify and strip binary
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          BUN_BIN=$(find /tmp/bun-src/build -name "bun" -o -name "bun-profile" 2>/dev/null | head -1)
          if [ -z "$BUN_BIN" ] || [ ! -f "$BUN_BIN" ]; then
            echo "error: Bun binary not found in build dir" >&2
            find /tmp/bun-src/build -type f 2>/dev/null
            exit 1
          fi

          mkdir -p /tmp/bun-dist
          cp "$BUN_BIN" /tmp/bun-dist/bun

          NDK_STRIP="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          if [ -x "$NDK_STRIP" ]; then
            "$NDK_STRIP" --strip-all /tmp/bun-dist/bun || true
          fi

          chmod +x /tmp/bun-dist/bun
          file /tmp/bun-dist/bun
          ls -lh /tmp/bun-dist/bun

          # Verify ELF architecture and Bionic interpreter
          if ! file /tmp/bun-dist/bun | grep -q "aarch64"; then
            echo "error: built binary is not aarch64" >&2
            exit 1
          fi

          (cd /tmp/bun-dist && sha256sum bun > bun.sha256)

      - name: Upload Bun binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bun-android-arm64
          path: /tmp/bun-dist/*
          if-no-files-found: error

      - name: Attach Bun to release (if tag provided)
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.bun_ref != 'main'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/bun-dist/bun
            /tmp/bun-dist/bun.sha256
        continue-on-error: true
