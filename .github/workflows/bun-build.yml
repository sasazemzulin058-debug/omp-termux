name: Build Bun for Android ARM64

on:
  workflow_dispatch:
    inputs:
      bun_ref:
        description: "Git ref/branch/tag of oven-sh/bun to build"
        required: true
        default: "main"
      use_commit:
        description: "Specific commit SHA to checkout (overrides ref if set)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-bun:
    name: Cross-compile Bun for Android aarch64 (Bionic)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Checkout omp-termux
        uses: actions/checkout@v4

      - name: Load version manifest
        id: manifest
        run: |
          source android/versions.env
          echo "ndk_version=$NDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "rust_toolchain=$RUST_TOOLCHAIN" >> "$GITHUB_OUTPUT"
          echo "bun_version=$BUN_VERSION" >> "$GITHUB_OUTPUT"
          echo "bun_bootstrap_version=$BUN_BOOTSTRAP_VERSION" >> "$GITHUB_OUTPUT"
          echo "android_api=$ANDROID_API" >> "$GITHUB_OUTPUT"

      - name: Install system build dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          timeout 180 sudo apt-get update -qq
          timeout 300 sudo apt-get install -y --no-install-recommends \
            ninja-build cmake libssl-dev libcurl4-openssl-dev ruby-full ccache \
            clang lld llvm wget
          clang --version

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain "${{ steps.manifest.outputs.rust_toolchain }}"
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup_ndk
        with:
          ndk-version: ${{ steps.manifest.outputs.ndk_version }}
          add-to-path: true

      - name: Link NDK compiler-rt builtins for Clang 21
        env:
          NDK_ROOT: ${{ steps.setup_ndk.outputs.ndk-path }}
          ANDROID_API: ${{ steps.manifest.outputs.android_api }}
        run: |
          set -euo pipefail
          CLANG_21_DIR="/usr/lib/llvm-21/lib/clang/21/lib/aarch64-unknown-linux-android${ANDROID_API}"
          sudo mkdir -p "$CLANG_21_DIR"
          NDK_CLANG_LIB="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/lib/clang/18/lib/linux"
          NDK_BUILTINS=$(find "$NDK_CLANG_LIB" -name "*builtins*aarch64*" 2>/dev/null | head -1)
          if [ -n "$NDK_BUILTINS" ]; then
            echo "Found NDK builtins: $NDK_BUILTINS"
            sudo ln -sf "$NDK_BUILTINS" "$CLANG_21_DIR/libclang_rt.builtins.a"
            echo "Created symlink: $CLANG_21_DIR/libclang_rt.builtins.a -> $NDK_BUILTINS"
          fi
          ls -la "$CLANG_21_DIR"
      - name: Clone Bun source
        env:
          BUN_REF: ${{ github.event.inputs.bun_ref || 'main' }}
          COMMIT_SHA: ${{ github.event.inputs.use_commit }}
        run: |
          echo "=== Cloning oven-sh/bun ($BUN_REF) ==="
          git clone --depth 50 "https://github.com/oven-sh/bun.git" /tmp/bun-src
          cd /tmp/bun-src
          if [ -n "$COMMIT_SHA" ]; then
            git checkout "$COMMIT_SHA"
          else
            git checkout "$BUN_REF"
          fi
          git submodule update --init --recursive --depth 1
          echo "Checked out commit: $(git rev-parse HEAD)"
          echo "bun_commit=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Patch Bun clang requirement for NDK r27c
        run: |
          set -euo pipefail
          cd /tmp/bun-src
          files=$(grep -RIl --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=build \
            -E '21[.]1[.]0|21[.]1[.]99' . || true)
          test -n "$files"
          printf '%s\n' "$files" | xargs sed -i \
            -e 's/>=[[:space:]]*21[.]1[.]0/>=18.0.0/g' \
            -e 's/version >=[[:space:]]*21[.]1[.]0/version >=18.0.0/g' \
            -e 's/<[[:space:]]*21[.]1[.]99/<22.0.0/g' \
            -e 's/21[.]1[.][0-9]*/18.0.3/g'
          sed -i \
            -e 's/LLVM_VERSION = "21[.]1[.]8"/LLVM_VERSION = "18.0.3"/g' \
            -e 's/LLVM_MAJOR = "21"/LLVM_MAJOR = "18"/g' \
            /tmp/bun-src/scripts/build/tools.ts
          flag_files=$(grep -RIl --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=build \
            -- '-Wno-character-conversion' /tmp/bun-src || true)
          if [ -n "$flag_files" ]; then
            printf '%s\n' "$flag_files" | xargs sed -i 's/[[:space:]]*-Wno-character-conversion//g'
          fi
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=build \
            -- '-Wno-character-conversion' /tmp/bun-src; then
            echo 'error: unsupported Bun warning flag remains' >&2
            exit 1
          fi
          if grep -nE 'LLVM_MAJOR = "21"|LLVM_VERSION = "21[.]1[.]8"' /tmp/bun-src/scripts/build/tools.ts; then
            echo 'error: Bun tools.ts LLVM gate patch incomplete' >&2
            exit 1
          fi
      - name: Install Bun bootstrapper
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.manifest.outputs.bun_bootstrap_version }}

      - name: Cross-compile Bun for aarch64-linux-android
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup_ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
          CCACHE_DIR: /tmp/ccache
          CFLAGS: "-Wno-error=unknown-warning-option"
          CXXFLAGS: "-Wno-error=unknown-warning-option -Wno-error=dangling"
          LDFLAGS: "-L${{ steps.setup_ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/${{ steps.manifest.outputs.android_api }}"
        run: |
          mkdir -p /tmp/ccache
          cd /tmp/bun-src
          echo "=== Building Bun for aarch64-linux-android (release) ==="
          echo "NDK: $ANDROID_NDK_ROOT"
          echo "Bootstrapper: $(bun --version)"
          echo "Start: $(date)"

          bun scripts/build.ts \
            --profile=release \
            --abi=android \
            --arch=aarch64 \
            --build-dir="build/release" \
            --configure-only
          find build/release -type f -name build.ninja -print0 | \
            xargs -0 -r sed -i 's/-Wno-character-conversion//g'
          ninja -C build/release

          echo "End: $(date)"

      - name: Verify and strip binary
        env:
          ANDROID_NDK_HOME: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          BUN_BIN=$(find /tmp/bun-src/build -name "bun" -o -name "bun-profile" 2>/dev/null | head -1)
          if [ -z "$BUN_BIN" ] || [ ! -f "$BUN_BIN" ]; then
            echo "error: Bun binary not found in build dir" >&2
            find /tmp/bun-src/build -type f 2>/dev/null
            exit 1
          fi

          mkdir -p /tmp/bun-dist
          cp "$BUN_BIN" /tmp/bun-dist/bun

          NDK_STRIP="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          if [ -x "$NDK_STRIP" ]; then
            "$NDK_STRIP" --strip-all /tmp/bun-dist/bun || true
          fi

          chmod +x /tmp/bun-dist/bun
          file /tmp/bun-dist/bun
          ls -lh /tmp/bun-dist/bun

          # Verify ELF architecture and Bionic interpreter
          if ! file /tmp/bun-dist/bun | grep -q "aarch64"; then
            echo "error: built binary is not aarch64" >&2
            exit 1
          echo "${{ steps.manifest.outputs.bun_version }}" > /tmp/bun-dist/bun.version
          (cd /tmp/bun-dist && sha256sum bun > bun.sha256)

      - name: Upload Bun binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bun-android-arm64
          path: /tmp/bun-dist/*
          if-no-files-found: error

      - name: Attach Bun to release (if tag provided)
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.bun_ref != 'main'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/bun-dist/bun
            /tmp/bun-dist/bun.sha256
        continue-on-error: true
