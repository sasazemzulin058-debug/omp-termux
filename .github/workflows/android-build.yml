name: Android build

# Cross-compiles the pi-natives addon for aarch64-linux-android (Termux/bionic)
# on a standard Ubuntu runner and uploads it as an artifact. This is the
# release/prebuilt path; on-device builds use android/scripts/build-termux.sh.
#
# The cross-compile uses the Android NDK directly (NDK clang as both compiler
# and linker) — cargo-zigbuild cannot provide bionic libc and is not a viable
# path for Android. The build script calls `napi build --target ...` directly
# so napi invokes `cargo build` (not cargo-zigbuild) with cargo/cc env pointing
# at the NDK clang.

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "packages/natives/**"
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "crates/**"
      - "packages/natives/**"
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    name: Cross-compile android-arm64 addon
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: 'C:/PROGRA~1/Git/bin/bash.exe --noprofile --norc -eo pipefail {0}'
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Rust target for the repo-pinned toolchain
        # rust-toolchain.toml pins nightly-2026-04-29; rustup auto-activates it
        # for any cargo invocation in the repo.
        shell: pwsh
        run: |
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { rustup toolchain install }
          rustup target add aarch64-linux-android

      - name: Install Android NDK r27
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: false


      - name: Install JS dependencies
        run: bun install --frozen-lockfile --minimum-release-age 0

      - name: Verify Android overlay
        run: python3 android/scripts/verify-overlay.py


      - name: Make CMake find Ninja
        run: |
          set -euo pipefail
          ninja=$(command -v ninja || command -v ninja-build)
          cmake_bin=$(command -v cmake)
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/cmake" <<EOF
          #!/bin/sh
          if [ "\$1" = "--build" ]; then
            exec "$cmake_bin" "\$@"
          fi
          args=""
          for arg in "\$@"; do
            case "\$arg" in
              -DCMAKE_SYSTEM_PROCESSOR=*) continue ;;
            esac
            args="\$args \"\$arg\""
          done
          eval exec "$cmake_bin" \$args -DCMAKE_MAKE_PROGRAM="$ninja" -DCMAKE_POLICY_DEFAULT_CMP0057=NEW
          EOF
          chmod +x "$RUNNER_TEMP/bin/cmake"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"


      - name: Cross-compile native addon (NDK clang)
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          CARGO_BUILD_JOBS: 1
          CARGO_PROFILE_CI_LTO: "false"
          CARGO_PROFILE_CI_CODEGEN_UNITS: "16"
          CARGO_PROFILE_CI_DEBUG: "false"
          RUSTFLAGS: "-C debuginfo=0"
          OPUS_NO_PKG_CONFIG: "1"

          CMAKE_GENERATOR: Ninja
          CMAKE_MAKE_PROGRAM: /usr/bin/ninja
          CMAKE_ARGS: -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja
        run: bash android/scripts/build-android-ci.sh

      - name: Upload addon artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi_natives.android-arm64
          path: |
            packages/natives/native/pi_natives.android-arm64.node
            packages/natives/native/pi_natives.android-arm64.node.sha256
          if-no-files-found: error
