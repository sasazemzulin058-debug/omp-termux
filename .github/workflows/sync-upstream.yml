name: Sync upstream

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch upstream
        run: git fetch https://github.com/can1357/oh-my-pi.git main --tags
      - name: Rebase overlay and validate patches
        run: |
          set -euo pipefail
          git merge --no-commit --no-ff FETCH_HEAD || {
            git merge --abort || true
            echo 'Upstream merge conflict. Open manual PR.'
            exit 1
          }
          bash android/scripts/apply-patches.sh
          git diff --exit-code -- crates packages
          git diff --check
      - name: Build release assets
        run: echo 'Validated. Android release workflow builds assets on tag.'
      - name: Push sync commit
        run: |
          git config user.name github-actions[bot]
          git config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git commit -am 'chore: sync upstream' || exit 0
          git push origin HEAD:main
