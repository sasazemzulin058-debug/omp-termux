name: Sync upstream

on:
  schedule:
    - cron: '17 3 */2 * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  issues: write
concurrency:
  group: upstream-sync
  cancel-in-progress: false

# Tracks the official upstream tip only. Never touches the generated tree,
# the patch queue, mod, or tags. Porting happens in port-patches.yml, so a
# red patch queue can never turn this workflow red.
jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record upstream tip
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/can1357/oh-my-pi.git 2>/dev/null || git remote set-url upstream https://github.com/can1357/oh-my-pi.git
          git fetch --no-tags upstream main
          upstream_tip=$(git rev-parse upstream/main)
          if [[ ! "$upstream_tip" =~ ^[0-9a-f]{40}$ ]]; then
            echo "error: fetched upstream tip is not a 40-character SHA: $upstream_tip" >&2
            exit 1
          fi
          if git show-ref --verify --quiet refs/heads/upstream; then
            old_upstream=$(git rev-parse refs/heads/upstream)
            git merge-base --is-ancestor "$old_upstream" "$upstream_tip" || {
              echo "error: upstream branch would move backwards ($old_upstream is not an ancestor of $upstream_tip)" >&2
              exit 1
            }
            git update-ref refs/heads/upstream "$upstream_tip" "$old_upstream"
          else
            git update-ref refs/heads/upstream "$upstream_tip"
          fi
          if [[ "${PUBLISH_UPSTREAM_BRANCH:-}" == 'true' ]]; then
            git push origin refs/heads/upstream:refs/heads/upstream
          else
            echo "Skipping remote upstream branch publication; local refs/heads/upstream retained"
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          printf '%s\n' "$upstream_tip" > android/UPSTREAM_TRACKED
          git add android/UPSTREAM_TRACKED
          git commit -m "chore: track upstream ${upstream_tip:0:12}" || echo "already tracked: $upstream_tip"
          git push origin HEAD:refs/heads/main
        env:
          PUBLISH_UPSTREAM_BRANCH: ${{ vars.PUBLISH_UPSTREAM_BRANCH }}
      - name: Notify track failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          msg="Upstream track failed on run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          issue_num=$(gh issue list --repo "${{ github.repository }}" --state open --search "Upstream track failure" --json number --jq '.[0].number // empty' || echo "")
          if [ -n "$issue_num" ]; then
            gh issue comment "$issue_num" --repo "${{ github.repository }}" --body "$msg" || true
          else
            gh issue create --repo "${{ github.repository }}" --title "Upstream track failure" --body "$msg" || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}
