name: Sync upstream

on:
  schedule:
    - cron: '17 3 */2 * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  issues: write
concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch upstream and prepare generated mod tree
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/can1357/oh-my-pi.git 2>/dev/null || git remote set-url upstream https://github.com/can1357/oh-my-pi.git
          git fetch --no-tags upstream main
          git fetch --no-tags origin main mod || true
          upstream_tip=$(git rev-parse upstream/main)
          if git show-ref --verify --quiet refs/heads/upstream; then
            old_upstream=$(git rev-parse refs/heads/upstream)
            git merge-base --is-ancestor "$old_upstream" "$upstream_tip" || {
              echo "error: local upstream branch would move backwards" >&2
              exit 1
            }
            git update-ref refs/heads/upstream "$upstream_tip" "$old_upstream"
          else
            git update-ref refs/heads/upstream "$upstream_tip"
          fi
          if [[ "${PUBLISH_UPSTREAM_BRANCH:-}" == 'true' ]]; then
            if ! git push origin refs/heads/upstream:refs/heads/upstream; then
              echo "error: PUBLISH_UPSTREAM_BRANCH=true but token cannot publish upstream branch; grant workflows permission (and contents:write) or unset repository variable" >&2
              exit 1
            fi
          else
            echo "Skipping remote upstream branch publication; local refs/heads/upstream retained"
          fi

          metadata_dir="$RUNNER_TEMP/android-metadata"
          mkdir -p "$metadata_dir"
          tar -C . -czf "$metadata_dir/metadata.tar.gz" android .github
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # Keep generated mod descendants of prior mod; never force-push.
          git switch --detach "$upstream_tip"
          if git show-ref --verify --quiet refs/remotes/origin/mod; then
            git merge --no-ff -s ours refs/remotes/origin/mod -m "chore: merge upstream for Android mod regeneration"
          fi
          git clean -ffdx
          # Remove upstream .github files before restoring repository metadata.
          git rm -r --ignore-unmatch .github
          tar -C . -xzf "$metadata_dir/metadata.tar.gz"
          if [[ ! "$upstream_tip" =~ ^[0-9a-f]{40}$ ]]; then
            echo "error: fetched upstream tip is not a 40-character SHA: $upstream_tip" >&2
            exit 1
          fi
          printf '%s\n' "$upstream_tip" > android/UPSTREAM_COMMIT

      - name: Apply standard Git patches in CI
        shell: bash
        run: |
          set -euo pipefail
          bash android/scripts/apply-patches.sh
      - name: Verify generated patched tree
        run: |
          set -euo pipefail
          git diff --check
          test -f package.json
          test -f bun.lock
          test -f crates/pi-natives/Cargo.toml
          test -f packages/natives/native/loader-state.js
          git status --short
      - name: Validate release inputs
        run: python3 android/scripts/check-release-inputs.py
      - name: Setup Bun and verify lockfile consistency
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Verify frozen lockfile
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          rm -rf .bun-cache node_modules
      - name: Commit and publish generated mod tree
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('packages/coding-agent/package.json'))['version'])")
          tag="v${version}-termux"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: generate Android mod ${version}" || true
          current_commit=$(git rev-parse HEAD)
          git push origin HEAD:refs/heads/mod
          if remote_tag=$(git ls-remote --exit-code origin "refs/tags/$tag"); then
            git fetch --no-tags origin "+refs/tags/$tag:refs/tags/$tag"
            tag_commit=$(git rev-parse "refs/tags/$tag^{commit}")
            if [ "$tag_commit" != "$current_commit" ]; then
              echo "error: release tag $tag points to $tag_commit, expected generated HEAD $current_commit" >&2
              exit 1
            fi
            echo "release tag already exists: $tag"
          else
            ls_remote_status=$?
            if [ "$ls_remote_status" -ne 2 ]; then
              echo "error: unable to query release tag $tag on origin" >&2
              exit "$ls_remote_status"
            fi
            git tag "$tag"
            git push origin "refs/tags/$tag"
          fi
          echo "dispatching Android release for $tag"
          gh workflow run android-release.yml --repo "${{ github.repository }}" --ref "$tag" -f tag="$tag"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Notify upstream sync failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          issue_num=$(gh issue list --repo "${{ github.repository }}" --label "android-sync" --state open --json number --jq '.[0].number // empty' || \
                       gh issue list --repo "${{ github.repository }}" --state open --search "Upstream sync failure" --json number --jq '.[0].number // empty' || \
                       echo "")
          msg="Upstream sync failed on run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          if [ -n "$issue_num" ]; then
            gh issue comment "$issue_num" --repo "${{ github.repository }}" --body "$msg" || true
          else
            gh issue create --repo "${{ github.repository }}" --title "Upstream sync failure" --label "android-sync" --body "$msg" || \
            gh issue create --repo "${{ github.repository }}" --title "Upstream sync failure" --body "$msg" || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}