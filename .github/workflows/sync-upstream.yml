name: Sync upstream

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import upstream tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/can1357/oh-my-pi.git main
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          git archive FETCH_HEAD | tar -x -C "$tmp"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='android/' \
            --exclude='quickstart.sh' \
            --exclude='install.sh' \
            --exclude='.bun-cache/' \
            --exclude='tmp/' \
            "$tmp/" ./
      - name: Apply deterministic Android overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 android/scripts/apply-overlay.py
          git diff --check -- . ':(exclude)packages/catalog/src/discovery/cursor-gen/agent_pb.ts' \
            ':(exclude)types/assets/index.d.ts' ':(exclude)README.md'
      - name: Verify upstream build inputs
        run: |
          test -f package.json
          test -f bun.lock
          test -f crates/pi-natives/Cargo.toml
          test -f packages/natives/native/loader-state.js
      - name: Push sync commit and version tag
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('packages/coding-agent/package.json'))['version'])")
          tag="v${version}-termux"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "upstream unchanged"
            exit 0
          fi
          git commit -m "chore: sync upstream OMP ${version}"
          if remote_tag_sha=$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}'); then
            if [ -n "$remote_tag_sha" ]; then
              head_sha=$(git rev-parse HEAD)
              if [ "$remote_tag_sha" = "$head_sha" ]; then
                echo "release already published: $tag"
                exit 0
              fi
              echo "error: immutable release tag already points to $remote_tag_sha: $tag" >&2
              echo "       upstream version is unchanged; next upstream version is required" >&2
              exit 1
            fi
          fi
          git tag "$tag"
          git push --atomic origin HEAD:main "refs/tags/$tag"
          echo "release queued for $tag"
        env:
          GH_TOKEN: ${{ github.token }}
