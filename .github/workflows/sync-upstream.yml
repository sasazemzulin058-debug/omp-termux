name: Sync upstream

on:
  schedule:
    - cron: '17 3 */2 * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  issues: write
concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import upstream tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/can1357/oh-my-pi.git main
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          git archive FETCH_HEAD | tar -x -C "$tmp"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='android/' \
            --exclude='quickstart.sh' \
            --exclude='install.sh' \
            --exclude='.bun-cache/' \
            --exclude='tmp/' \
            --exclude='README.md' \
            "$tmp/" ./
      - name: Apply deterministic Android overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 android/scripts/apply-overlay.py
          git diff --check -- . ':(exclude)packages/catalog/src/discovery/cursor-gen/agent_pb.ts' \
            ':(exclude)types/assets/index.d.ts' ':(exclude)README.md'
      - name: Verify upstream build inputs
        run: |
          test -f package.json
          test -f bun.lock
          test -f crates/pi-natives/Cargo.toml
          test -f packages/natives/native/loader-state.js
      - name: Validate release inputs
        run: python3 android/scripts/check-release-inputs.py
      - name: Setup Bun and verify lockfile consistency
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Regenerate lockfile for overlay dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Overlay mutates package.json (pi-hermes-memory pinned to immutable commit).
          # Regenerate bun.lock so it matches the post-overlay tree before frozen validation.
          # This keeps upstream sync reproducible: every rsync + overlay yields the same lock.
          bun install
          echo "lockfile regenerated after overlay"
          # Verify hermes pin is present in lockfile
          if ! grep -q 'pi-hermes-memory.*#'"e049747" bun.lock; then
            echo "error: bun.lock missing pinned hermes commit after regeneration" >&2
            exit 1
          fi
          if grep -q 'pi-hermes-memory#main' bun.lock; then
            echo "error: bun.lock contains mutable #main spec" >&2
            exit 1
          fi
      - name: Verify frozen lockfile
        shell: bash
        run: |
          set -euo pipefail
          # Frozen install must now pass against the regenerated lockfile.
          if ! bun install --frozen-lockfile; then
            echo "error: bun.lock is out of sync with package.json after overlay regeneration" >&2
            exit 1
          fi
          # Do not restore bun.lock — keep the overlay-regenerated version.
          rm -rf .bun-cache node_modules
      - name: Push sync commit and version tag
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('packages/coding-agent/package.json'))['version'])")
          tag="v${version}-termux"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "upstream unchanged"
            exit 0
          fi
          git commit -m "chore: sync upstream OMP ${version}"
          if remote_tag_sha=$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}'); then
            if [ -n "$remote_tag_sha" ]; then
              head_sha=$(git rev-parse HEAD)
              if [ "$remote_tag_sha" = "$head_sha" ]; then
                echo "release already published: $tag"
                exit 0
              fi
              echo "warning: tag $tag already exists on $remote_tag_sha, pushing main only without re-tagging"
              git push origin HEAD:main
              exit 0
            fi
          fi
          git tag "$tag"
          git push --atomic origin HEAD:main "refs/tags/$tag"
          echo "dispatching android release for $tag"
          gh workflow run android-release.yml --repo "${{ github.repository }}" --ref "$tag" -f tag="$tag"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Notify upstream sync failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          issue_num=$(gh issue list --repo "${{ github.repository }}" --label "android-sync" --state open --json number --jq '.[0].number // empty' || \
                       gh issue list --repo "${{ github.repository }}" --state open --search "Upstream sync failure" --json number --jq '.[0].number // empty' || \
                       echo "")
          msg="Upstream sync failed on run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          if [ -n "$issue_num" ]; then
            gh issue comment "$issue_num" --repo "${{ github.repository }}" --body "$msg" || true
          else
            gh issue create --repo "${{ github.repository }}" --title "Upstream sync failure" --label "android-sync" --body "$msg" || \
            gh issue create --repo "${{ github.repository }}" --title "Upstream sync failure" --body "$msg" || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}