name: Sync upstream

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import upstream tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/can1357/oh-my-pi.git main
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          git archive FETCH_HEAD | tar -x -C "$tmp"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='android/' \
            --exclude='quickstart.sh' \
            --exclude='install.sh' \
            "$tmp/" ./
      - name: Apply deterministic Android overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 android/scripts/apply-overlay.py
          git diff --check -- . ':(exclude)packages/catalog/src/discovery/cursor-gen/agent_pb.ts' \
            ':(exclude)types/assets/index.d.ts' ':(exclude)README.md'
      - name: Verify upstream build inputs
        run: |
          test -f package.json
          test -f bun.lock
          test -f crates/pi-natives/Cargo.toml
          test -f packages/natives/native/loader-state.js
      - name: Push sync commit and version tag
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('packages/coding-agent/package.json'))['version'])")
          tag="v${version}-termux"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: sync upstream OMP ${version}" || true
          git tag -f "$tag"
          git push origin HEAD:main
          git push origin "$tag" --force
