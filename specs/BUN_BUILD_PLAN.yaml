goal: |
  Set up a CI workflow in omp-termux that cross-compiles Bun from source
  for aarch64-linux-android (Bionic), producing a drop-in replacement
  for the current @oven/bun-linux-aarch64-android@1.3.14 binary.

  The binary must be ABI-compatible with pi_natives.android-arm64.node
  (linked to /system/bin/linker64, Bionic libc, API level 24+).

research_findings:
  current_bun: "1.3.14 — only official Android aarch64 release"
  next_release: "1.4.0 unreleased, exists only on main branch"
  key_fixes_in_main:
    - "PR #38246: bun build --compile PIE load bias fix (fixes OMP 5/5 segfault)"
    - "PR #37367/#38168: mimalloc Android SIGSEGV fixes"
    - "PR #39084/#30769/#32490: seccomp SIGSYS workarounds (close_range, openat2)"
    - "PR #30391-93: bionic-correct sys wrappers (termios, rusage, ucontext_t)"
    - "PR #36852: Zig linkat FUSE EACCES on Android SDCARD"
  upstream_build_system:
    toolchain: "Zig (bundled) + NDK r27c"
    target_triple: "aarch64-unknown-linux-android28"
    ci_platform: "Buildkite, cross from debian-13 aarch64 host"
    jsc: "WebKit/JSC built from source as part of Bun build"
  community_precedent:
    - repo: "bd-loser/bun-termux"
      method: "GitHub Actions, NDK r27c, aarch64-android28, .deb output"
    - repo: "guysoft/opencode-termux"
      method: "cross-compile Bun + JSC standalone"
  estimated_build_time: "30-60 min on GitHub Actions ubuntu-latest (8GB RAM)"
  estimated_disk: "~25 GB (JSC + Zig cache + NDK)"

decisions:
  - Pin to a specific oven-sh/bun commit post-#38246 (merged 2026-08-14)
  - Cross-compile from ubuntu-latest using NDK r27c
  - Use bd-loser/bun-termux workflow as reference but adapt for OMP needs
  - Output: single bun binary, verified with readelf for linker64/bionic
  - Store in GitHub release as bun-android-arm64 asset
  - Update android/versions.env to track BUN_COMMIT alongside BUN_VERSION
