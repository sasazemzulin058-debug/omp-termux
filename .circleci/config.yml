version: 2.1

orbs:
  bun: oven/bun@1

parameters:
  publish_release:
    type: boolean
    default: false

jobs:
  android-release:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    environment:
      BUN_VERSION: "1.3.14"
      ANDROID_NDK_VERSION: "r27"
      ANDROID_NDK_ROOT: /opt/android-ndk-r27
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_CI_LTO: "false"
      CARGO_PROFILE_CI_OPT_LEVEL: "0"
      CARGO_PROFILE_CI_CODEGEN_UNITS: "16"
      CARGO_PROFILE_CI_DEBUG: "false"
      RUSTFLAGS: "-C debuginfo=0"
      OPUS_NO_PKG_CONFIG: "1"
    steps:
      - checkout
      - run:
          name: Install build dependencies
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y clang cmake file ninja-build python3 curl unzip
      - run:
          name: Install Bun
          command: |
            set -euo pipefail
            tmp="$(mktemp -d)"
            curl -fsSL --retry 3 -o "$tmp/bun.zip" \
              "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
            mkdir -p "$HOME/.bun/bin"
            unzip -q "$tmp/bun.zip" -d "$tmp"
            install -m 0755 "$tmp/bun-linux-x64/bun" "$HOME/.bun/bin/bun"
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            bun --version
      - run:
          name: Install pinned Rust target
          command: |
            set -euo pipefail
            rustup show active-toolchain || rustup toolchain install
            rustup target add aarch64-linux-android
      - restore_cache:
          keys:
            - cargo-v1-{{ checksum "Cargo.lock" }}
            - cargo-v1-
      - run:
          name: Install Android NDK r27
          command: |
            set -euo pipefail
            if [ ! -x "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" ]; then
              tmp="$(mktemp -d)"
              curl -fsSL --retry 3 -o "$tmp/ndk.zip" \
                "https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip"
              sudo rm -rf "$ANDROID_NDK_ROOT"
              sudo mkdir -p /opt
              sudo unzip -q "$tmp/ndk.zip" -d /opt
              sudo mv "/opt/android-ndk-${ANDROID_NDK_VERSION}" "$ANDROID_NDK_ROOT"
              sudo chown -R "$(id -u):$(id -g)" "$ANDROID_NDK_ROOT"
              rm -rf "$tmp"
            fi
      - run:
          name: Install JavaScript dependencies
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            bun install --frozen-lockfile --minimum-release-age 0
      - run:
          name: Verify Android overlay
          command: |
            python3 android/scripts/verify-overlay.py
            python3 android/scripts/check-release-inputs.py
      - run:
          name: Build Android native addon
          command: bash android/scripts/build-android-ci.sh
      - run:
          name: Build JavaScript bundle
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            bun --cwd=packages/stats scripts/generate-client-bundle.ts --generate
            bun --cwd=packages/coding-agent scripts/generate-docs-index.ts --generate
            bun --cwd=packages/coding-agent scripts/embed-mupdf-wasm.ts --generate
            bun build --target=bun --minify --keep-names \
              --external @oh-my-pi/pi-natives \
              --define 'process.env.PI_BUNDLED="true"' \
              packages/coding-agent/src/cli.ts --outdir termux-build
            mkdir -p termux-bundle/node_modules/@oh-my-pi/pi-natives/native
            cp termux-build/cli.js termux-bundle/cli.js
            cp packages/natives/package.json termux-bundle/node_modules/@oh-my-pi/pi-natives/
            cp packages/natives/native/index.js packages/natives/native/loader-state.js \
              packages/natives/native/embedded-addon.js termux-bundle/node_modules/@oh-my-pi/pi-natives/native/
            tar -czf termux-js.tar.gz -C termux-bundle .
      - run:
          name: Package and verify release assets
          command: |
            set -euo pipefail
            addon=packages/natives/native/pi_natives.android-arm64.node
            test -s "$addon"
            sha256sum -c "$addon.sha256"
            test -s termux-js.tar.gz
            rm -rf termux-bundle
            mkdir termux-bundle
            tar -xzf termux-js.tar.gz -C termux-bundle
            mkdir -p termux-bundle/node_modules/@oh-my-pi/pi-natives/native
            cp "$addon" termux-bundle/node_modules/@oh-my-pi/pi-natives/native/
            tar -czf omp-termux.tar.gz -C termux-bundle .
            sha256sum omp-termux.tar.gz > omp-termux.tar.gz.sha256
            sha256sum -c omp-termux.tar.gz.sha256
            tar -tzf omp-termux.tar.gz | grep -Fx './cli.js'
            tar -tzf omp-termux.tar.gz | grep -F './node_modules/@oh-my-pi/pi-natives/native/pi_natives.android-arm64.node'
      - save_cache:
          key: cargo-v1-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo
            - ~/.rustup
            - target
      - store_artifacts:
          path: omp-termux.tar.gz
          destination: omp-termux.tar.gz
      - store_artifacts:
          path: omp-termux.tar.gz.sha256
          destination: omp-termux.tar.gz.sha256
      - store_artifacts:
          path: packages/natives/native/pi_natives.android-arm64.node
          destination: pi_natives.android-arm64.node
      - store_artifacts:
          path: packages/natives/native/pi_natives.android-arm64.node.sha256
          destination: pi_natives.android-arm64.node.sha256

workflows:
  android-release:
    jobs:
      - android-release:
          filters:
            tags:
              only: /^v.*-termux$/
            branches:
              ignore: /.*/
